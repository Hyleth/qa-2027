#
# 为什么 CI 上只跑 mock 模式：
#   接真模型要 API Key，Key 放到仓库 Secrets 里才能用（Settings → Secrets → Actions）。
#   但真模型每次结果都不一样，做成门禁会天天红 —— 真实的做法是
#   **提交时跑 mock 快速冒烟（快、稳定），每天定时跑一次真模型（慢、看趋势）**。


# ---------------------------------------------------------------- 为什么 CI 不跑 UI
# UI 自动化（Playwright）默认不在这份 CI 里跑。两个原因：
#   1. GitHub 免费机器没装浏览器，要额外下 150MB，慢且经常挂
#   2. UI 用例天生不稳（渲染延迟、动画、分辨率），做成门禁会天天红
# 真实项目的做法：接口测试进来做门禁，UI 测试每天定时跑一次（nightly），红了人工看。
# 这句话面试可以直接讲，是个能体现判断力的细节。
